name: release-please

# Publishing is a merge, not a command. Every push to main hands the commit log
# to Release Please, which keeps one open pull request holding the next version
# and the changelog. Merging that pull request is the release: it tags
# `v<version>`. Any other push only refreshes the pending pull request.
# A release does not deploy: an admin deploys a release with scripts/deploy-go.py.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
      snapshot_created: ${{ steps.release.outputs['plugins/snapshot--release_created'] }}
      snapshot_tag: ${{ steps.release.outputs['plugins/snapshot--tag_name'] }}
      snapshot_version: ${{ steps.release.outputs['plugins/snapshot--version'] }}
      freeze_created: ${{ steps.release.outputs['plugins/freeze--release_created'] }}
      freeze_tag: ${{ steps.release.outputs['plugins/freeze--tag_name'] }}
      freeze_version: ${{ steps.release.outputs['plugins/freeze--version'] }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # A pull request opened by GITHUB_TOKEN starts no workflow, so the release
      # pull request would carry no checks and the release commit would ship
      # unproven. `workflow_dispatch` is one of the two documented exceptions to
      # that rule, so CI is asked for by name on the release branch. The run
      # reports against the branch head, which is the commit the pull request
      # shows.
      - name: Run CI on the release pull request
        if: steps.release.outputs.pr != ''
        env:
          GH_TOKEN: ${{ github.token }}
          # The job has no checkout, so gh cannot read the repo from git.
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ fromJSON(steps.release.outputs.pr || '{}').headBranchName }}
        run: gh workflow run check.yml --ref "$BRANCH"

  # Runs only on the push that merged the release pull request, so the artifact
  # is built from the release commit and attached to the release just created.
  build:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Build the tagged commit, not the push that ran this workflow: when a
      # release is created by a later run, the push commit is newer than the tag.
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.1"
      # The archive holds every binary, built with Release=true so /healthz says
      # it is a release, and the scripts deploy-go.py installs from it.
      - name: Build and upload the release archive
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$(git rev-parse "$TAG^{commit}")"
          name="carrel-$TAG-linux-amd64"
          mkdir -p "$name/dist"
          for cmd in carrel carrel-agent carrel-deployd carrel-fetch carrel-fnd carrel-fn-init; do
            CGO_ENABLED=0 go build -trimpath \
              -ldflags "-X github.com/NYCU-WinLab/carrel/internal/carrel.Release=true" \
              -o "$name/dist/$cmd" "./cmd/$cmd"
          done
          cp -r scripts "$name/scripts"
          rm -rf "$name/scripts/__pycache__"
          git rev-parse HEAD > "$name/REVISION"
          tar -czf "$name.tar.gz" "$name"
          sha256sum "$name.tar.gz" > SHA256SUMS
          gh release upload "$TAG" "$name.tar.gz" SHA256SUMS --clobber

  # The snapshot plugin has its own release (snapshot-v<version>). Its
  # artifact is what a site file lists: a .tar.gz with the executable
  # "plugin" at its top (docs/operator-handbook.md, "Installing plugins").
  build-snapshot:
    needs: release-please
    if: needs.release-please.outputs.snapshot_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.snapshot_tag }}
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.1"
      - name: Build and upload the plugin artifact
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.snapshot_tag }}
          VERSION: ${{ needs.release-please.outputs.snapshot_version }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$(git rev-parse "$TAG^{commit}")"
          mkdir artifact
          CGO_ENABLED=0 go build -trimpath -ldflags "-X main.version=$VERSION" \
            -o artifact/plugin ./plugins/snapshot/cmd/plugin
          tar -czf snapshot.tar.gz -C artifact plugin
          sha256sum snapshot.tar.gz > SHA256SUMS
          gh release upload "$TAG" snapshot.tar.gz SHA256SUMS --clobber
          # A plugin release is never the latest: the newest carrel release is.
          latest=$(gh release list --limit 100 --json tagName --jq '[.[].tagName | select(test("^v[0-9]+[.][0-9]+[.][0-9]+$"))] | first')
          test -n "$latest"
          gh release edit "$latest" --latest

  # The freeze plugin has its own release (freeze-v<version>). Its
  # artifact is what a site file lists: a .tar.gz with the executable
  # "plugin" at its top (docs/operator-handbook.md, "Installing plugins").
  build-freeze:
    needs: release-please
    if: needs.release-please.outputs.freeze_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.freeze_tag }}
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.1"
      - name: Build and upload the plugin artifact
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.freeze_tag }}
          VERSION: ${{ needs.release-please.outputs.freeze_version }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$(git rev-parse "$TAG^{commit}")"
          mkdir artifact
          CGO_ENABLED=0 go build -trimpath -ldflags "-X main.version=$VERSION" \
            -o artifact/plugin ./plugins/freeze/cmd/freeze
          tar -czf freeze.tar.gz -C artifact plugin
          sha256sum freeze.tar.gz > SHA256SUMS
          gh release upload "$TAG" freeze.tar.gz SHA256SUMS --clobber
          # A plugin release is never the latest: the newest carrel release is.
          latest=$(gh release list --limit 100 --json tagName --jq '[.[].tagName | select(test("^v[0-9]+[.][0-9]+[.][0-9]+$"))] | first')
          test -n "$latest"
          gh release edit "$latest" --latest
