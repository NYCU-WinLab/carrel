// The plugin contract (#564, #660). A plugin is a service on a unix socket
// on each node (#563); carrel-agent calls it and relays operations for the
// control plane. Regenerate internal/pluginpb with internal/pluginpb/gen.sh.
//
// Installed by carrel (#662), a plugin does not open its socket: systemd
// passes the listening socket as fd 3 (LISTEN_FDS=1), and the plugin serves
// this service on it. It runs as a dynamic user and keeps its state in
// $STATE_DIRECTORY. See "Installing plugins" in docs/operator-handbook.md.
syntax = "proto3";

package carrel.plugin.v1;

option go_package = "github.com/NYCU-WinLab/carrel/internal/pluginpb";

service Plugin {
  // Describe names the plugin, its version, the contract revision it was
  // built against and the operations it offers.
  rpc Describe(DescribeRequest) returns (DescribeResponse);
  // Probe says whether this node can run the plugin, and why not.
  rpc Probe(ProbeRequest) returns (ProbeResponse);
  // StartOperation starts an operation once per idempotency key; the same
  // key again returns the same operation. A plugin keeps every operation it
  // started across restarts, so carrel takes a refusal of a key it sent
  // before as proof that no operation of that key goes on.
  rpc StartOperation(StartRequest) returns (Operation);
  // GetOperation reads an operation by its key. Ask again until done.
  // NOT_FOUND says no operation of the key goes on.
  rpc GetOperation(GetRequest) returns (Operation);
  // Cancel stops an operation that is not done; a done one is returned as is.
  rpc Cancel(CancelRequest) returns (Operation);
}

message DescribeRequest {}

message OperationType {
  string name = 1;
  // JSON Schema of the parameters, a JSON object.
  string params_schema = 2;
  string description = 3;
  // Who may call it. By default only an admin may. member lets a member
  // call it on one of their own machines: the schema must then require a
  // top-level "machine", which the control plane checks against the
  // caller's tenant and hands to the plugin as the machine's VMID.
  bool member = 4;
  // read_only: the operation changes nothing, so it is listed on the
  // read-only endpoint too.
  bool read_only = 5;
  // Hints for clients, as in MCP tool annotations: the operation may
  // destroy data, or a repeat with the same arguments does nothing more.
  bool destructive = 6;
  bool idempotent = 7;
  // A toolset of the tool contract the tool is also listed under, such as
  // "machines"; it is always listed under "plugins".
  string toolset = 8;
  // dry_run: the plugin honours StartRequest.dry_run for this operation.
  // Without it, carrel never sends a dry run to the plugin: a plugin built
  // before the field would run the operation for real.
  bool dry_run = 9;
  // An operation on an object carrel keeps a record of (#663): object_kind
  // names one of DescribeResponse.objects, object_effect is create, delete,
  // use or list, and object_param names the required string parameter that
  // names the object (none for list, which is read_only and lists the
  // machine's objects of the kind). The schema must also require a top-level "machine":
  // an object belongs to one machine. carrel charges the tenant's quota and
  // reserves the record before the start, and sends its id as
  // StartRequest.reservation.
  string object_kind = 10;
  string object_effect = 11;
  string object_param = 12;
  // stopped: the machine must be stopped while the operation runs (#663).
  // carrel refuses a paused guest, shuts a running one down gracefully
  // before the start and, once the run has ended, starts it again and waits
  // until it is ready. StartRequest.machine says power_state "stopped"; a
  // plugin must refuse a start of such an operation that does not, as an
  // agent built before the field sends none.
  bool stopped = 13;
  // rewinds: the operation may bring the machine's disk back to an earlier
  // state, as a snapshot rollback does. carrel then treats the guest's
  // access files as unknown and waits for a report from a new boot.
  bool rewinds = 14;
  // confirm: an operation on an object takes a required string parameter
  // "confirm" that must repeat the object's name. carrel checks it before
  // anything changes, as a core rollback does.
  bool confirm = 15;
}

// A quota dimension the plugin's objects are charged to. Tenants' quota
// holds it as any other; an admin sets it with quota_set.
message QuotaDimension {
  // a-z, 0-9 and _, and not a dimension carrel counts itself.
  string name = 1;
  // The limit of a tenant whose quota does not set it.
  double default_limit = 2;
  string unit = 3;
  // measured: once the nodes have sampled the tenant's storage, the
  // dimension counts what the tenant's disk objects hold on it, not what
  // they were charged. A create then adds nothing yet, and a tenant already
  // over the limit gets no more.
  bool measured = 4;
}

// What one object charges: amount of a dimension the plugin declares, per
// object, or times a fact of the object's machine (per is cpu, memory_mb or
// disk_gb).
message Charge {
  string dimension = 1;
  double amount = 2;
  string per = 3;
}

// A kind of object an operation can create. carrel keeps a record of each
// object, charges it to the tenant and refuses the actions in holds while
// the object's machine has one.
message ObjectKind {
  string name = 1;
  repeated Charge charges = 2;
  // holds: any of freeze, migrate (also drain), backfill and delete. A kind
  // without delete dies with its machine: machine_delete forgets it.
  repeated string holds = 3;
  // disk: an object may hold up to its machine's disk on the node's
  // storage, as a disk snapshot does; admission checks the node for it.
  bool disk = 4;
}

message DescribeResponse {
  string name = 1;
  string version = 2;
  // The contract revision the plugin was built against.
  uint32 contract = 3;
  repeated OperationType operations = 4;
  repeated QuotaDimension quota = 5;
  repeated ObjectKind objects = 6;
}

message ProbeRequest {}

message ProbeResponse {
  bool supported = 1;
  string reason = 2;
}

message StartRequest {
  string idempotency_key = 1;
  string operation = 2;
  // JSON object, valid against the operation's params_schema.
  string params = 3;
  // dry_run: report what the operation would do and change nothing. A
  // dry run, and any start of a read_only operation, must answer done in
  // its first reply; carrel does not ask after its key again.
  bool dry_run = 4;
  // reservation: the id of the record carrel holds for an operation with an
  // object_kind. A plugin must refuse such a start without one, as
  // INVALID_ARGUMENT: an agent built before the field drops it, and carrel
  // would then not have counted the object.
  string reservation = 5;
  // machine: JSON facts of the machine the operation acts on, for an
  // operation whose schema requires "machine": vmid, kind ("vm" or "ct"),
  // node, cpu, memory_mb, disk_gb, power_state and configuration, a digest
  // of what a disk rewind must find unchanged (resources, NICs and ISO).
  string machine = 6;
}

message GetRequest {
  string idempotency_key = 1;
}

message CancelRequest {
  string idempotency_key = 1;
}

message Operation {
  string idempotency_key = 1;
  // running, succeeded, failed or cancelled.
  string state = 2;
  bool done = 3;
  // 0 to 100.
  uint32 progress = 4;
  // JSON object, set when succeeded.
  string result = 5;
  string error = 6;
  // The backend's own handle, such as a Proxmox UPID.
  string task = 7;
  // What the operation is doing now, for people.
  string message = 8;
  // When failed: a carrel error code the caller acts on, one of invalid,
  // conflict, not_found, quota_exceeded, capacity_exhausted or unsupported,
  // with error as its message. Any other code, or none, fails the call as
  // plugin_failed.
  string error_code = 9;
  // When failed: a JSON object of further facts, such as {"recovery":
  // "revise_request"}. Its keys are added to the error carrel returns.
  string error_details = 10;
}
